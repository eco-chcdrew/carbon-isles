<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="碳寶島：跟著碳寶偵探調查碳盤查、碳足跡、碳減量、碳抵換與碳中和五座島，認識範疇一、二、三全部 15 類、產品碳足跡、減量路徑、減量額度與碳中和宣告。">
<meta property="og:title" content="碳寶島">
<meta property="og:description" content="用五座 3D 小島認識碳盤查、碳足跡、碳減量、碳抵換與碳中和。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>碳寶島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;800;900&display=swap">
<style>
:root{
  --sky:#5D9FD6;
  --paper:#F2F6F1;
  --paper-2:#E5EDE4;
  --card:#FFFFFF;
  --ink:#22303A;
  --muted:#66757C;
  --line:#CBD7CF;
  --soft:#DFE7E1;
  --accent:#1E9E55;
  --accent-ink:#FFFFFF;
  --accent-lip:#137443;
  --red:#E5483B;
  --red-lip:#B23126;
  --string:#C2413A;
  --amber:#B87A10;
  --note:#FFF3C4;
  --wash:#E2F4E7;
  --inv:#2F5D8A;
  --cfp:#3C7A48;
  --rdc:#2B7A70;
  --ofs:#9A6418;
  --neu:#7A4E9C;
  --ic-ink:#FFFFFF;
  --halo:#FFFFFF;
  --scrim:rgb(18 28 36 / .45);
  --shade:rgb(20 40 30 / .12);
  --offset:0 3px 0 rgb(20 40 30 / .08), 0 10px 26px rgb(20 40 30 / .16);
  --pop:0 3px 0 rgb(20 40 30 / .10), 0 6px 18px rgb(20 40 30 / .16);
  --pop-lg:0 4px 0 rgb(20 40 30 / .08), 0 16px 40px rgb(20 40 30 / .24);
  --vignette:rgb(120 86 40 / .26);
  --grain:none;
  --wobble:999px;
  --wobble-2:16px;
  --f-display:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-hand:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-type:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#14284A; --paper:#1B2230; --paper-2:#263041; --card:#2A3446; --ink:#EEF3F6; --muted:#A9B6C0; --line:#3E4B5E; --soft:#354255;
    --accent:#4CCB7F; --accent-ink:#0D2216; --accent-lip:#2E9A5B; --red:#F0675B; --red-lip:#B8443A; --string:#EE6A5A; --amber:#F0B25A; --note:#3F3A22; --wash:#21402F;
    --inv:#9CC0EE; --cfp:#9AD3A3; --rdc:#8AD8CB; --ofs:#EBC27A; --neu:#D2B4F0; --ic-ink:#13202A; --halo:#141A24;
    --scrim:rgb(4 8 14 / .62); --shade:rgb(0 0 0 / .35); --offset:0 3px 0 rgb(0 0 0 / .25), 0 10px 26px rgb(0 0 0 / .4); --pop:0 3px 0 rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .35); --pop-lg:0 4px 0 rgb(0 0 0 / .3), 0 16px 40px rgb(0 0 0 / .5); --vignette:rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#14284A; --paper:#1B2230; --paper-2:#263041; --card:#2A3446; --ink:#EEF3F6; --muted:#A9B6C0; --line:#3E4B5E; --soft:#354255;
  --accent:#4CCB7F; --accent-ink:#0D2216; --accent-lip:#2E9A5B; --red:#F0675B; --red-lip:#B8443A; --string:#EE6A5A; --amber:#F0B25A; --note:#3F3A22; --wash:#21402F;
  --inv:#9CC0EE; --cfp:#9AD3A3; --rdc:#8AD8CB; --ofs:#EBC27A; --neu:#D2B4F0; --ic-ink:#13202A; --halo:#141A24;
  --scrim:rgb(4 8 14 / .62); --shade:rgb(0 0 0 / .35); --offset:0 3px 0 rgb(0 0 0 / .25), 0 10px 26px rgb(0 0 0 / .4); --pop:0 3px 0 rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .35); --pop-lg:0 4px 0 rgb(0 0 0 / .3), 0 16px 40px rgb(0 0 0 / .5); --vignette:rgb(0 0 0 / .45);
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.14)}}

#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;z-index:0;isolation:isolate}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 85% 80% at 50% 50%, transparent 58%, var(--vignette))}
#loader{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;pointer-events:none}

#ui{position:absolute;inset:0;z-index:2;pointer-events:none;--top:max(10px, env(safe-area-inset-top, 0px));--bot:max(12px, env(safe-area-inset-bottom, 0px));--side-l:max(12px, env(safe-area-inset-left, 0px));--side-r:max(12px, env(safe-area-inset-right, 0px));--navh:78px}
.topbar{position:absolute;top:var(--top);left:var(--side-l);right:var(--side-r);display:flex;align-items:center;gap:8px;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0;padding:5px 18px 5px 5px;background:var(--card);border-radius:999px;box-shadow:var(--pop)}
.brand svg{flex:none;width:38px;height:38px}
.brand .kicker{margin:0;font-size:11px;font-weight:800;line-height:1.1;color:var(--accent);letter-spacing:.04em}
.brand h1{margin:0;font-size:19px;font-weight:900;line-height:1.2;letter-spacing:.06em}
.hud{appearance:none;display:flex;align-items:center;gap:14px;padding:8px 16px;border:0;border-radius:999px;background:var(--card);box-shadow:var(--pop);cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted)}
.hud:hover{background:var(--wash)}
.hud:active{translate:0 2px}
.hud > span{display:inline-flex;align-items:center;gap:6px}
.hud svg{flex:none;width:24px;height:24px}
.hud em{font-style:normal}
.hud b{font-weight:900;font-size:15.5px;color:var(--ink)}
.hud.bump{animation:bump .5s ease}
.daynight{margin-left:auto;display:flex;gap:2px;padding:4px;background:var(--card);border-radius:999px;box-shadow:var(--pop)}
.daynight button{appearance:none;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;line-height:1;padding:8px 12px;border-radius:999px;cursor:pointer}
.daynight button:hover{color:var(--ink)}
.daynight button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-lip)}
.daynight svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.daynight circle,.daynight button[data-theme="dark"] path{fill:currentColor}
.daynight button[data-theme="dark"] path{stroke:none}
.tools{position:absolute;left:var(--side-l);top:calc(var(--top) + 62px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.tools > *{pointer-events:auto}
.tool{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:50px;height:50px;border:0;border-radius:16px;background:var(--card);color:var(--muted);box-shadow:var(--pop);cursor:pointer;font-weight:800;font-size:10.5px;line-height:1}
.tool svg{width:22px;height:22px}
.tool:active{translate:0 2px}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-lip), 0 6px 14px rgb(20 40 30 / .16)}
.tool.links[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-lip), 0 6px 14px rgb(20 40 30 / .16)}
.hint{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--bot) + var(--navh) + 10px);font-weight:700;font-size:13px;line-height:1.3;color:var(--ink);background:var(--card);border-radius:999px;padding:7px 14px;box-shadow:var(--pop);pointer-events:none;white-space:nowrap}

.modes{position:absolute;left:50%;translate:-50% 0;bottom:var(--bot);display:flex;gap:4px;padding:6px;background:var(--card);border-radius:28px;box-shadow:var(--pop-lg);pointer-events:auto;max-width:calc(100% - 24px)}
.modes button{appearance:none;flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px;padding:7px 6px 6px;border:0;border-radius:22px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:800;line-height:1.1;cursor:pointer;white-space:nowrap;transition:background .15s}
.modes button:hover{background:var(--paper)}
.modes .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--isle, var(--accent));color:var(--ic-ink);font-style:normal;font-weight:900;font-size:16px;line-height:1;box-shadow:0 3px 0 color-mix(in srgb, var(--isle, var(--accent)) 65%, #000);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.modes .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modes button[aria-pressed="true"]{background:var(--wash);color:var(--ink)}
.modes button[aria-pressed="true"] .ic{transform:translateY(-4px) scale(1.12)}
.modes button:active .ic{transform:translateY(1px) scale(.94)}
.modes .s{display:none}

#panel{position:absolute;right:var(--side-r);top:calc(var(--top) + 62px);bottom:calc(var(--bot) + var(--navh) + 12px);width:min(420px, 42vw);display:flex;flex-direction:column;background:var(--paper);border-radius:26px;box-shadow:var(--pop-lg);pointer-events:auto;overflow:hidden}
.grip{display:none}
.clip{display:none}
.file-head{display:flex;align-items:center;gap:10px;padding:12px 12px 11px 20px;min-height:58px;background:var(--card);border-bottom:1px solid var(--soft)}
.file-label{flex:1;min-width:0;font-size:13.5px;font-weight:800;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{flex:none;font-size:13px;font-weight:900;line-height:1.2;color:#fff;background:var(--red);border-radius:999px;padding:5px 12px;box-shadow:0 3px 0 var(--red-lip);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.icon-btn{flex:none;appearance:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:var(--paper-2);color:var(--muted);cursor:pointer;font-size:15px;font-weight:900;line-height:1}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.panel-body{overflow-y:auto;min-height:0;flex:1;padding:14px 20px 26px;overscroll-behavior:contain}

.eyebrow{margin:2px 0 0;font-family:var(--f-hand);font-size:15px;color:var(--accent)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:13.5px;color:var(--muted);margin:2px 0 0;font-family:var(--f-hand)}
.crumb button{appearance:none;border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:4px;font-size:14px;font-family:var(--f-hand)}
.station{font-family:var(--f-hand);font-size:13px;color:var(--muted);margin-left:4px}
.panel-body h2{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.35;margin:6px 0 10px;text-wrap:balance}
.lead{font-size:15.5px;margin:0 0 4px}
.panel-body h3{display:inline-block;font-family:var(--f-hand);font-weight:400;font-size:18px;line-height:1.4;color:var(--ink);margin:24px 0 10px;padding:0 6px 3px 2px;background:linear-gradient(transparent 58%, var(--wash) 58%, var(--wash) 92%, transparent 92%)}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.items li{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:11px}
ul.items li::before{content:"";width:11px;height:11px;margin-top:7px;background:var(--c);border-radius:52% 48% 55% 45% / 47% 55% 45% 53%;box-shadow:0 0 0 1.5px var(--line)}
ul.items b{display:block;font-weight:700;line-height:1.5}
ul.items span{display:block;color:var(--muted);font-size:14px;line-height:1.6}
.formula{font-family:var(--f-hand);font-size:16px;line-height:26px;background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 25px, var(--soft) 25px 26px);background-position:0 6px;border:1.5px solid var(--line);border-radius:var(--wobble-2);padding:6px 14px 7px;margin:0 0 8px}
.how{margin:0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;line-height:1.4;border:1.5px solid var(--soft);background:var(--card);border-radius:var(--wobble);padding:3px 10px}
.note{position:relative;margin-top:26px;background:var(--note);border-radius:3px 14px 4px 12px / 12px 4px 14px 3px;padding:16px 16px 14px;rotate:-0.6deg;box-shadow:2px 3px 0 var(--shade)}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:80px;height:18px;margin-left:-40px;background:rgb(255 255 255 / .5);rotate:3deg;border-radius:2px}
.panel-body .note h3{display:block;background:none;color:var(--accent);padding:0;margin:0 0 4px;font-family:var(--f-hand);font-size:17px;font-weight:400}
.note p{margin:0;font-family:var(--f-hand);font-size:16.5px;line-height:1.7}
.linkrow{display:grid;gap:8px}
.linkbtn{appearance:none;text-align:left;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;width:100%;padding:10px 12px;border:1.5px solid var(--soft);background:var(--card);border-radius:var(--wobble-2);cursor:pointer}
.linkbtn:hover{border-color:var(--string)}
.linkbtn i{width:12px;height:12px;border-radius:52% 48% 55% 45% / 47% 55% 45% 53%;background:var(--string);margin-top:6px}
.linkbtn b{display:block;font-size:14px}
.linkbtn small{display:block;color:var(--muted);font-size:13px;line-height:1.55}
.navrow{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:24px;padding-top:14px;border-top:1.5px dashed var(--soft)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{appearance:none;border:2px solid var(--line);background:var(--card);font-family:var(--f-hand);font-size:16px;line-height:1.2;padding:7px 15px 8px;border-radius:var(--wobble);cursor:pointer;box-shadow:2px 3px 0 var(--shade)}
.btn:nth-child(even){border-radius:var(--wobble-2)}
.btn:hover{background:var(--wash)}
.btn:active{translate:1px 2px;box-shadow:1px 1px 0 var(--shade)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}

.isles{display:grid;gap:16px;margin-top:20px}
.isle{position:relative;background:var(--card);border:1.5px solid var(--soft);border-radius:var(--wobble-2);padding:13px 16px 15px 18px;box-shadow:2px 3px 0 var(--shade)}
.isle::before{content:attr(data-tab);position:absolute;top:12px;right:14px;width:30px;height:30px;display:grid;place-items:center;font-family:var(--f-hand);font-size:17px;color:var(--isle);border:1.5px solid var(--isle);border-radius:52% 48% 55% 45% / 47% 55% 45% 53%}
.isle-name{margin:0;font-family:var(--f-display);font-size:23px;line-height:1.3;color:var(--isle)}
.isle-q{margin:2px 0 0;font-weight:500}
.isle-meta{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.isle-shape{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.isle-fac{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.isle-fac b{font-weight:500;color:var(--ink)}
.fac-tag{pointer-events:none;opacity:0;transition:opacity .2s;font-family:var(--f-hand);font-weight:800;font-size:14px;line-height:1.2;background:var(--card);color:var(--ink);border:0;border-radius:999px;padding:5px 12px;white-space:nowrap;box-shadow:0 2px 0 rgb(0 0 0 / .14), 0 3px 8px rgb(0 0 0 / .14)}
.fac-tag.show{opacity:1}
.secret-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:18px 0 0;padding:10px 12px;border:1.5px dashed var(--soft);border-radius:var(--wobble);font-size:14px;font-family:var(--f-hand)}
.secret-cta b{font-weight:400;font-size:17px;color:var(--accent)}
.mission{position:relative;margin:12px 0 18px;padding:12px 14px 14px;border:2px solid var(--line);border-radius:var(--wobble-2);background:var(--card);box-shadow:2px 3px 0 var(--shade)}
.m-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:0;font-family:var(--f-hand);font-size:18px;line-height:1.35}
.m-tag{font-size:13px;line-height:1.3;color:#FFF;background:#B5382A;border-radius:4px;padding:1px 7px 2px;align-self:center}
.m-head b{font-weight:400;color:var(--isle)}
.m-bar{height:8px;border-radius:6px;background:var(--wash);margin:10px 0 3px;overflow:hidden}
.m-bar i{display:block;height:100%;background:var(--isle);border-radius:6px;transition:width .4s ease}
.m-count{margin:0;font-size:12.5px;color:var(--muted)}
.m-steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.m-steps li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.5}
.m-steps li::before{content:"";box-sizing:border-box;width:16px;height:16px;margin-top:3px;border:1.5px solid var(--line);border-radius:4px;font-size:11px;line-height:13px;text-align:center}
.m-steps li.done::before{content:"✓";background:var(--isle);border-color:var(--isle);color:#FFF}
.m-steps li.done > span{color:var(--muted)}
.m-steps li.bonus::before{content:"✦";border:0;color:#D9A441;font-size:14px;line-height:16px}
.m-steps small{display:block;color:var(--muted);font-size:12.5px}
.m-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.m-keys button{appearance:none;cursor:pointer;font-size:13px;line-height:1.4;border:1.5px solid var(--soft);background:var(--paper);color:var(--ink);border-radius:var(--wobble);padding:2px 9px}
.m-keys button:hover{border-color:var(--isle)}
.m-keys button.done{border-style:dashed;color:var(--muted)}
.m-keys button.done::before{content:"✓ ";color:var(--isle)}
.mission .btns{margin-top:12px}
.mbar{appearance:none;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;width:100%;box-sizing:border-box;margin:8px 0 2px;padding:6px 10px 7px;border:1.5px dashed var(--accent);border-radius:var(--wobble);background:transparent;font-family:var(--f-hand);font-size:14px;line-height:1.4;color:var(--ink);cursor:pointer;text-align:left}
.mbar:hover{background:var(--wash)}
.mbar .m-tag{font-family:var(--f-body)}
.mbar b{font-weight:400;color:var(--accent)}
.event{position:relative;margin:16px 0 6px;padding:12px 14px 13px;border:2px solid var(--accent);border-radius:14px 5px 16px 7px / 7px 16px 5px 14px;background:color-mix(in srgb, var(--accent) 9%, var(--card));box-shadow:2px 3px 0 var(--shade)}
.event.sniff{border-color:#C9A13B;background:color-mix(in srgb, #D9A441 12%, var(--card))}
.ev-t{margin:0;font-family:var(--f-hand);font-size:18px;line-height:1.35;color:var(--accent)}
.event.sniff .ev-t{color:var(--ink)}
.event p{margin:6px 0 0;font-size:14.5px;line-height:1.65}
.event .scrawl{font-family:var(--f-hand);font-size:16.5px;line-height:1.55;rotate:-.6deg;padding:6px 10px;border:1.5px dashed var(--soft);border-radius:6px;background:var(--paper)}
.event .btns{margin-top:10px}
.ev-note[hidden]{display:none}
.isle-case{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.isle-case b{font-weight:500;color:var(--ink)}
.isle-case .got{color:#B5382A}
.gist{margin:2px 0 12px;padding:9px 12px 10px;border-radius:12px 6px 12px 8px;background:color-mix(in srgb, #E2B04A 18%, var(--card));font-size:15.5px;line-height:1.65;font-weight:500}

    const off = !pick, el = it.el;
    if (el.classList.contains('lbl-off') !== off) el.classList.toggle('lbl-off', off);
    if (!off){ const [dx, dy] = pick;
      if ((el._dx || 0) !== dx){ el._dx = dx; el.style.left = dx ? dx + 'px' : ''; }
      if ((el._dy || 0) !== dy){ el._dy = dy; el.style.top = dy ? dy + 'px' : ''; }
      placed.push([it.r[0] + dx, it.r[1] + dy, it.r[2] + dx, it.r[3] + dy]); }
  }
  if (missed && landMode && tq < 3 && !tween && !layoutT){ setTq(tq + 1); dcAt = 0; }
}

resize();
applyTheme();
mascot.g.position.copy(spotOf(ms.hex));
bridge.ready = true;
UI.ready3d();
loop();
